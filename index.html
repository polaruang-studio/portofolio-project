<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>polaruang.studio — Portofolio Arsitektur 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-green: #659B35;
      --brand-green-soft: rgba(101, 155, 53, 0.14);
      --brand-coral: #F06440;
      --brand-blue: #5B87D6;
      --bg-canvas: #F5F6F4;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-solid: #FFFFFF;
      --surface-hover: #F3F5F2;
      --border: rgba(17, 24, 39, 0.10);
      --text-primary: #182026;
      --text-secondary: #5C6873;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    body.dark {
      --bg-canvas: #121518;
      --surface: rgba(26, 31, 37, 0.94);
      --surface-solid: #1A1F25;
      --surface-hover: #242B33;
      --border: rgba(255, 255, 255, 0.11);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      transition: background 0.25s ease, color 0.25s ease;
    }

    #viewer-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .pill {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 18px;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }

    /* Top Bar Layout */
    .top-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .top-left-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      pointer-events: auto;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px 8px 12px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: block;
    }

    .brand-wordmark {
      display: inline-flex;
      align-items: baseline;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.025em;
      line-height: 1;
      color: var(--text-primary);
    }

    .brand-wordmark .dot {
      color: var(--text-primary);
    }

    .brand-wordmark .studio-ext {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-left: 1px;
      transform: translateY(4px);
      display: inline-block;
    }

    /* Info Dimension Pill */
    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px 7px 8px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      max-width: min(360px, 88vw);
    }

    .info-pill:hover {
      background: var(--surface-hover);
    }

    .info-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(240, 100, 64, 0.14);
      color: var(--brand-coral);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }

    .info-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Project Selector Center */
    .selector-wrap {
      position: relative;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .selector-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
    }

    .nav-arrow {
      width: 34px;
      height: 38px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .nav-arrow:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .selector-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--text-primary);
      background: var(--surface-solid);
      color: var(--text-primary);
      cursor: pointer;
      min-width: 245px;
      max-width: 340px;
      text-align: left;
    }

    .selector-meta {
      overflow: hidden;
    }

    .selector-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--brand-green);
      margin-bottom: 2px;
    }

    .selector-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Project Dropdown Menu */
    .project-menu {
      position: absolute;
      top: calc(100% + 10px);
      width: min(370px, 92vw);
      max-height: 60vh;
      overflow-y: auto;
      padding: 12px;
      display: none;
      z-index: 40;
    }

    .project-menu.open {
      display: block;
    }

    .menu-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      padding: 4px 8px 10px;
      text-transform: uppercase;
    }

    .project-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .project-item:hover {
      background: var(--surface-hover);
    }

    .project-item.active {
      background: var(--brand-green-soft);
      border-color: rgba(101, 155, 53, 0.35);
    }

    .project-item-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .project-item-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .cat-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(91, 135, 214, 0.14);
      color: var(--brand-blue);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Top Right Tools */
    .tools-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .tool-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .tool-btn.active {
      background: var(--brand-green-soft);
      color: var(--brand-green);
    }

    /* Project Detail Drawer / Card */
    .detail-card {
      position: fixed;
      top: 126px;
      left: 16px;
      z-index: 25;
      width: min(350px, calc(100vw - 32px));
      padding: 16px 18px;
      display: none;
    }

    .detail-card.open {
      display: block;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .detail-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .detail-close {
      border: none;
      background: var(--surface-hover);
      color: var(--text-secondary);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    .dim-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .dim-box {
      background: var(--surface-hover);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }

    .dim-box span {
      display: block;
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .dim-box strong {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .detail-desc {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* Bottom Dock (Section Controls + Camera Views) */
    .bottom-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 24px);
    }

    /* Section Cut Control Bar */
    .section-panel {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 16px;
      width: 100%;
    }

    .section-panel.open {
      display: flex;
    }

    .section-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--brand-coral);
      background: rgba(240, 100, 64, 0.13);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .section-axis-group {
      display: inline-flex;
      background: var(--surface-hover);
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .axis-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .axis-btn.active {
      background: var(--surface-solid);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .slider-wrap input[type="range"] {
      width: 135px;
      accent-color: var(--brand-green);
      cursor: pointer;
    }

    .slider-val {
      font-weight: 700;
      color: var(--text-primary);
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .reset-cut-btn {
      border: 1px solid var(--border);
      background: var(--surface-solid);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .reset-cut-btn:hover {
      background: var(--surface-hover);
    }

    /* Camera View Presets Bar */
    .views-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border-radius: 999px;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }

    .views-pill::-webkit-scrollbar {
      display: none;
    }

    .view-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }

    .view-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .view-btn.active {
      background: var(--brand-green);
      color: #FFFFFF;
    }

    .view-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    .view-btn.section-view.active {
      background: var(--brand-coral);
      color: #FFFFFF;
    }

    /* Loading Overlay */
    .loader-pill {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .loader-pill.show {
      display: flex;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid var(--brand-green-soft);
      border-top-color: var(--brand-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 820px) {
      .top-bar {
        flex-wrap: wrap;
        top: 12px;
        left: 12px;
        right: 12px;
      }
      .selector-wrap {
        order: 3;
        width: 100%;
      }
      .selector-pill {
        width: 100%;
        justify-content: space-between;
      }
      .selector-trigger {
        flex: 1;
        max-width: none;
        min-width: 0;
      }
      .detail-card {
        top: 168px;
      }
      .view-btn {
        padding: 7px 11px;
        font-size: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer-container"></div>

  <!-- Top Controls -->
  <header class="top-bar">
    <div class="top-left-stack">
      <a href="./" class="pill brand-badge" title="polaruang.studio">
        <!-- Embedded LOGO_POLARUANG.svg -->
        <svg class="brand-logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Logo polaruang.studio">
          <path fill="#669926" d="M275 50 C145 50 58 145 58 270 C58 312 69 348 89 378 L48 456 L112 456 L142 405 C175 432 220 448 275 448 C372 448 446 392 465 305 L385 305 C370 352 328 382 275 382 C185 382 128 325 128 248 C128 170 185 116 275 116 C328 116 370 146 385 192 L465 192 C446 105 372 50 275 50 Z" />
          <path fill="#FFFFFF" d="M128 248 C128 170 185 116 275 116 C328 116 370 146 385 192 L475 192 L475 212 L392 212 L392 285 L475 285 L475 305 L385 305 C370 352 328 382 275 382 C185 382 128 325 128 248 Z" />
          <circle cx="268" cy="248" r="88" fill="#FF704D" />
          <g fill="none" stroke="#FFFFFF" stroke-width="6">
            <line x1="268" y1="160" x2="268" y2="336" />
            <line x1="180" y1="248" x2="356" y2="248" />
            <ellipse cx="268" cy="248" rx="44" ry="88" />
            <path d="M 192 204 Q 268 226 344 204" />
            <path d="M 192 292 Q 268 270 344 292" />
          </g>
          <g fill="none" stroke="#0B3D91" stroke-width="5.5" stroke-linecap="round">
            <path d="M 86 355 Q 150 285 245 315 T 395 310" />
            <path d="M 74 378 Q 145 322 230 342 T 370 338" />
            <path d="M 96 402 Q 155 362 215 375" />
            <path d="M 255 368 Q 305 376 345 362" />
          </g>
        </svg>

        <span class="brand-wordmark">
          polaruang<span class="dot">.</span><span class="studio-ext">studio</span>
        </span>
      </a>

      <button type="button" id="info-pill-btn" class="pill info-pill" title="Lihat detail dimensi & deskripsi bangunan">
        <span class="info-dot">i</span>
        <span class="info-text" id="info-summary">Memuat informasi bangunan...</span>
      </button>
    </div>

    <!-- Center Project Switcher -->
    <div class="selector-wrap">
      <div class="pill selector-pill">
        <button type="button" class="nav-arrow" id="prev-project" title="Proyek Sebelumnya" aria-label="Sebelumnya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        <button type="button" class="selector-trigger" id="selector-trigger">
          <div class="selector-meta">
            <div class="selector-kicker" id="current-kicker">PORTOFOLIO (1/1)</div>
            <div class="selector-title" id="current-title">Memuat Karya...</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <button type="button" class="nav-arrow" id="next-project" title="Proyek Berikutnya" aria-label="Berikutnya">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="pill project-menu" id="project-menu">
        <div class="menu-label">PILIH KARYA POLARUANG.STUDIO</div>
        <div id="project-list"></div>
      </div>
    </div>

    <!-- Right Action Tools -->
    <div class="pill tools-pill">
      <button type="button" class="tool-btn" id="btn-screenshot" title="Simpan Foto PNG">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button type="button" class="tool-btn active" id="btn-edges" title="Garis Tepi SketchUp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-rotate" title="Putar Otomatis">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button type="button" class="tool-btn" id="btn-theme" title="Ganti Tema Terang / Gelap">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Project Detail Popover -->
  <aside class="pill detail-card" id="detail-card">
    <div class="detail-header">
      <div>
        <div class="selector-kicker" id="detail-cat-year">ARSITEKTUR • 2026</div>
        <h2 class="detail-title" id="detail-title">Nama Bangunan</h2>
      </div>
      <button type="button" class="detail-close" id="detail-close" aria-label="Tutup">✕</button>
    </div>
    <div class="dim-grid">
      <div class="dim-box">
        <span>Lebar</span>
        <strong id="dim-width">0.00 m</strong>
      </div>
      <div class="dim-box">
        <span>Panjang</span>
        <strong id="dim-length">0.00 m</strong>
      </div>
      <div class="dim-box">
        <span>Tinggi</span>
        <strong id="dim-height">0.00 m</strong>
      </div>
    </div>
    <p class="detail-desc" id="detail-desc">Deskripsi konsep bangunan.</p>
  </aside>

  <!-- Loading Indicator -->
  <div class="pill loader-pill" id="loader-pill">
    <div class="spinner"></div>
    <span>Memuat model 3D...</span>
  </div>

  <!-- Bottom Camera & Section Dock -->
  <div class="bottom-dock">
    <!-- Section / Plan Cut Control Bar -->
    <div class="pill section-panel" id="section-panel">
      <span class="section-badge" id="section-mode-label">Mode Denah</span>

      <div class="section-axis-group" id="potongan-axis-group" style="display: none;">
        <button type="button" class="axis-btn active" data-axis="x">Potongan A–A</button>
        <button type="button" class="axis-btn" data-axis="z">Potongan B–B</button>
        <button type="button" class="axis-btn" id="btn-flip-cut" title="Balik Sisi Potongan">⇄ Balik</button>
      </div>

      <div class="slider-wrap">
        <span id="slider-label">Elevasi Potong:</span>
        <input type="range" id="section-slider" min="5" max="95" value="32" step="1" />
        <span class="slider-val" id="slider-val">1.50 m</span>
      </div>

      <button type="button" class="reset-cut-btn" id="btn-close-section">Tutup Irisan</button>
    </div>

    <!-- Camera Presets -->
    <nav class="pill views-pill" aria-label="Sudut Kamera & Irisan Bangunan">
      <button type="button" class="view-btn active" data-view="isometric">Isometrik</button>
      <button type="button" class="view-btn" data-view="top">Atas</button>
      <button type="button" class="view-btn" data-view="front">Depan</button>
      <button type="button" class="view-btn" data-view="back">Belakang</button>
      <button type="button" class="view-btn" data-view="left">Kiri</button>
      <button type="button" class="view-btn" data-view="right">Kanan</button>
      <div class="view-divider"></div>
      <button type="button" class="view-btn section-view" data-view="denah">Denah</button>
      <button type="button" class="view-btn section-view" data-view="potongan">Potongan</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    let projects = [];
    let currentIndex = 0;
    let showEdges = true;
    let autoRotate = false;
    let darkTheme = false;

    let sectionMode = 'none';
    let sectionAxis = 'x';
    let sectionFlip = false;
    let sectionRatio = 0.32;

    let currentBounds = {
      min: new THREE.Vector3(-4, 0, -6),
      max: new THREE.Vector3(4, 7, 6),
      size: new THREE.Vector3(8, 7, 12),
      center: new THREE.Vector3(0, 3.5, 0)
    };

    let camAnim = null;

    const container = document.getElementById('viewer-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF5F6F4);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(16, 13, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minDistance = 1.5;
    controls.maxDistance = 180;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xdbe2e8, 0.7);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
    dirLight.position.set(22, 36, 24);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    let gridHelper = new THREE.GridHelper(60, 60, 0xCBD5E1, 0xE2E8F0);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const edgeObjects = [];
    const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);

    const cutGuideGeo = new THREE.PlaneGeometry(1, 1);
    const cutGuideMat = new THREE.MeshBasicMaterial({
      color: 0xF06440,
      transparent: true,
      opacity: 0.08,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const cutGuideMesh = new THREE.Mesh(cutGuideGeo, cutGuideMat);
    const cutGuideOutline = new THREE.LineSegments(
      new THREE.EdgesGeometry(cutGuideGeo),
      new THREE.LineBasicMaterial({ color: 0xF06440, transparent: true, opacity: 0.65 })
    );
    cutGuideMesh.add(cutGuideOutline);
    cutGuideMesh.visible = false;
    scene.add(cutGuideMesh);

    const gltfLoader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    gltfLoader.setDRACOLoader(dracoLoader);

    const FALLBACK_PROJECTS = [
      {
        slug: 'villa-tropis-kontemporer',
        title: 'Villa Tropis Kontemporer',
        category: 'Arsitektur Residensial',
        location: 'Bandung, Jawa Barat',
        year: '2026',
        description: 'Hunian tropis modern dengan bukaan lebar, taman dalam ruang, dan tata massa 2 lantai yang memaksimalkan penghawaan silang.',
        demoType: 'villa'
      },
      {
        slug: 'kafe-creative-space',
        title: 'Kafe & Creative Space Polaruang',
        category: 'Komersial & Retail',
        location: 'Jakarta Selatan',
        year: '2026',
        description: 'Ruang komersial 2 lantai dengan mezanin terbuka, fasad kisi kayu, dan area komunal terintegrasi.',
        demoType: 'cafe'
      },
      {
        slug: 'paviliun-galeri-bentang-lebar',
        title: 'Paviliun & Galeri Bentang Lebar',
        category: 'Hospitality & Villa',
        location: 'Ubud, Bali',
        year: '2025',
        description: 'Struktur atap pelana lebar menaungi ruang pamer terbuka dan area peristirahatan dengan orientasi pemandangan alam.',
        demoType: 'pavilion'
      }
    ];

    function buildProceduralDemo(type) {
      const group = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xF4F3EF, roughness: 0.75 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xD6CFC2, roughness: 0.85 });
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xB87A4B, roughness: 0.6 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x3D464D, roughness: 0.55 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0x659B35, roughness: 0.65 });

      const addBox = (w, h, d, x, y, z, mat) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        return mesh;
      };

      addBox(8, 0.25, 12, 0, 0.125, 0, floorMat);
      addBox(8, 3.2, 0.2, 0, 1.85, -5.9, wallMat);
      addBox(0.2, 3.2, 12, -3.9, 1.85, 0, wallMat);
      addBox(0.2, 3.2, 12, 3.9, 1.85, 0, wallMat);
      addBox(4.2, 3.2, 0.18, -1.8, 1.85, -0.5, wallMat);
      addBox(0.18, 3.2, 5.2, 0.3, 1.85, -3.2, wallMat);
      addBox(2.4, 0.45, 2.0, -2.2, 0.48, 3.2, accentMat);
      addBox(2.0, 0.5, 2.2, -2.5, 0.5, -3.8, woodMat);

      addBox(8, 0.25, 11.2, 0, 3.55, -0.4, floorMat);
      addBox(8, 3.0, 0.2, 0, 5.15, -5.9, wallMat);
      addBox(0.2, 3.0, 11.2, -3.9, 5.15, -0.4, wallMat);
      addBox(0.2, 3.0, 11.2, 3.9, 5.15, -0.4, wallMat);
      addBox(8, 0.9, 0.15, 0, 4.1, 5.1, woodMat);
      addBox(4.0, 3.0, 0.18, 1.9, 5.15, -1.0, wallMat);

      const roof = addBox(8.8, 0.35, 12.8, 0, 6.85, -0.2, roofMat);
      if (type === 'pavilion') roof.rotation.z = 0.06;

      return group;
    }

    function applyClippingToModel(enabled) {
      modelGroup.traverse((child) => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => {
            if (enabled) {
              if (m.userData.origSide === undefined) m.userData.origSide = m.side;
              m.side = THREE.DoubleSide;
              m.clippingPlanes = [clipPlane];
              m.clipShadows = true;
            } else {
              if (m.userData.origSide !== undefined) m.side = m.userData.origSide;
              m.clippingPlanes = null;
            }
            m.needsUpdate = true;
          });
        }
      });

      edgeObjects.forEach((line) => {
        line.material.clippingPlanes = enabled ? [clipPlane] : null;
        line.material.needsUpdate = true;
      });
    }

    function updateSectionCut(moveCamera = false) {
      const panel = document.getElementById('section-panel');
      const axisGroup = document.getElementById('potongan-axis-group');
      const modeLabel = document.getElementById('section-mode-label');
      const sliderLabel = document.getElementById('slider-label');
      const sliderVal = document.getElementById('slider-val');

      if (sectionMode === 'none') {
        panel.classList.remove('open');
        cutGuideMesh.visible = false;
        applyClippingToModel(false);
        return;
      }

      panel.classList.add('open');
      applyClippingToModel(true);

      const { min, max, size, center } = currentBounds;
      const pad = 0.6;

      if (sectionMode === 'denah') {
        modeLabel.textContent = 'Mode Denah';
        axisGroup.style.display = 'none';
        sliderLabel.textContent = 'Elevasi Potong:';

        const cutY = min.y + sectionRatio * size.y;
        clipPlane.normal.set(0, -1, 0);
        clipPlane.constant = cutY;

        sliderVal.textContent = `${(cutY - min.y).toFixed(2)} m`;

        cutGuideMesh.visible = true;
        cutGuideMesh.rotation.set(-Math.PI / 2, 0, 0);
        cutGuideMesh.position.set(center.x, cutY, center.z);
        cutGuideMesh.scale.set(size.x + pad, size.z + pad, 1);

        if (moveCamera) {
          const dist = Math.max(size.x, size.z) * 1.65 + 4;
          animateCameraTo(
            new THREE.Vector3(center.x, center.y + dist, center.z + 0.05),
            center
          );
        }
      } else if (sectionMode === 'potongan') {
        modeLabel.textContent = 'Mode Potongan';
        axisGroup.style.display = 'inline-flex';
        sliderLabel.textContent = 'Posisi Irisan:';

        if (sectionAxis === 'x') {
          const cutX = min.x + sectionRatio * size.x;
          clipPlane.normal.set(sectionFlip ? 1 : -1, 0, 0);
          clipPlane.constant = sectionFlip ? -cutX : cutX;
          sliderVal.textContent = `${(cutX - min.x).toFixed(2)} m`;

          cutGuideMesh.visible = true;
          cutGuideMesh.rotation.set(0, Math.PI / 2, 0);
          cutGuideMesh.position.set(cutX, center.y, center.z);
          cutGuideMesh.scale.set(size.z + pad, size.y + pad, 1);

          if (moveCamera) {
            const dist = Math.max(size.y, size.z) * 1.7 + 4;
            const sideSign = sectionFlip ? -1 : 1;
            animateCameraTo(
              new THREE.Vector3(center.x + sideSign * dist, center.y + size.y * 0.08, center.z),
              center
            );
          }
        } else {
          const cutZ = min.z + sectionRatio * size.z;
          clipPlane.normal.set(0, 0, sectionFlip ? 1 : -1);
          clipPlane.constant = sectionFlip ? -cutZ : cutZ;
          sliderVal.textContent = `${(cutZ - min.z).toFixed(2)} m`;

          cutGuideMesh.visible = true;
          cutGuideMesh.rotation.set(0, 0, 0);
          cutGuideMesh.position.set(center.x, center.y, cutZ);
          cutGuideMesh.scale.set(size.x + pad, size.y + pad, 1);

          if (moveCamera) {
            const dist = Math.max(size.x, size.y) * 1.7 + 4;
            const sideSign = sectionFlip ? -1 : 1;
            animateCameraTo(
              new THREE.Vector3(center.x, center.y + size.y * 0.08, center.z + sideSign * dist),
              center
            );
          }
        }
      }
    }

    function animateCameraTo(targetPos, targetLook) {
      camAnim = {
        startPos: camera.position.clone(),
        endPos: targetPos.clone(),
        startTarget: controls.target.clone(),
        endTarget: targetLook.clone(),
        t: 0
      };
    }

    function setCameraView(viewName) {
      document.querySelectorAll('.view-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === viewName);
      });

      const { size, center } = currentBounds;
      const maxDim = Math.max(size.x, size.y, size.z, 4);
      const dist = maxDim * 1.65;

      if (viewName === 'denah') {
        sectionMode = 'denah';
        sectionRatio = 0.32;
        document.getElementById('section-slider').value = 32;
        updateSectionCut(true);
        return;
      }

      if (viewName === 'potongan') {
        sectionMode = 'potongan';
        sectionRatio = 0.50;
        document.getElementById('section-slider').value = 50;
        updateSectionCut(true);
        return;
      }

      sectionMode = 'none';
      updateSectionCut(false);

      switch (viewName) {
        case 'isometric':
          animateCameraTo(
            new THREE.Vector3(center.x + dist * 0.78, center.y + dist * 0.58, center.z + dist * 0.78),
            center
          );
          break;
        case 'top':
          animateCameraTo(
            new THREE.Vector3(center.x, center.y + dist * 1.25, center.z + 0.05),
            center
          );
          break;
        case 'front':
          animateCameraTo(
            new THREE.Vector3(center.x, center.y + size.y * 0.08, center.z + dist * 1.15),
            center
          );
          break;
        case 'back':
          animateCameraTo(
            new THREE.Vector3(center.x, center.y + size.y * 0.08, center.z - dist * 1.15),
            center
          );
          break;
        case 'left':
          animateCameraTo(
            new THREE.Vector3(center.x - dist * 1.15, center.y + size.y * 0.08, center.z),
            center
          );
          break;
        case 'right':
          animateCameraTo(
            new THREE.Vector3(center.x + dist * 1.15, center.y + size.y * 0.08, center.z),
            center
          );
          break;
      }
    }

    function clearCurrentModel() {
      while (modelGroup.children.length > 0) {
        modelGroup.remove(modelGroup.children[0]);
      }
      edgeObjects.length = 0;
    }

    function setupLoadedObject(rootObj, project) {
      clearCurrentModel();

      const rawBox = new THREE.Box3().setFromObject(rootObj);
      const rawCenter = rawBox.getCenter(new THREE.Vector3());
      rootObj.position.x -= rawCenter.x;
      rootObj.position.z -= rawCenter.z;
      rootObj.position.y -= rawBox.min.y;

      modelGroup.add(rootObj);

      rootObj.traverse((child) => {
        if (child.isMesh && child.geometry) {
          child.castShadow = true;
          child.receiveShadow = true;
          const edgesGeo = new THREE.EdgesGeometry(child.geometry, 24);
          const edgesMat = new THREE.LineBasicMaterial({
            color: darkTheme ? 0xCBD5E1 : 0x1E293B,
            transparent: true,
            opacity: 0.55
          });
          const lineSeg = new THREE.LineSegments(edgesGeo, edgesMat);
          lineSeg.visible = showEdges;
          child.add(lineSeg);
          edgeObjects.push(lineSeg);
        }
      });

      const box = new THREE.Box3().setFromObject(modelGroup);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      currentBounds = { min: box.min.clone(), max: box.max.clone(), size, center };

      const widthStr = size.x.toFixed(2);
      const lengthStr = size.z.toFixed(2);
      const heightStr = size.y.toFixed(2);
      const cat = project.category || 'Arsitektur';

      document.getElementById('info-summary').textContent =
        `${cat} • ${widthStr} × ${lengthStr} × ${heightStr} m`;

      document.getElementById('detail-cat-year').textContent =
        `${cat.toUpperCase()} • ${project.year || '2026'}`;
      document.getElementById('detail-title').textContent = project.title;
      document.getElementById('dim-width').textContent = `${widthStr} m`;
      document.getElementById('dim-length').textContent = `${lengthStr} m`;
      document.getElementById('dim-height').textContent = `${heightStr} m`;
      document.getElementById('detail-desc').textContent =
        project.description || 'Karya desain arsitektur 3D oleh polaruang.studio.';

      setCameraView('isometric');
    }

    async function loadProject(index) {
      if (!projects.length) return;
      currentIndex = (index + projects.length) % projects.length;
      const project = projects[currentIndex];

      const catUpper = (project.category || 'KARYA').toUpperCase();
      document.getElementById('current-kicker').textContent =
        `${catUpper} (${currentIndex + 1}/${projects.length})`;
      document.getElementById('current-title').textContent = project.title;

      if (project.slug) {
        const url = new URL(window.location);
        url.searchParams.set('project', project.slug);
        window.history.replaceState({}, '', url);
      }

      renderProjectMenu();

      const loaderEl = document.getElementById('loader-pill');
      const modelPath = project.model || project.modelUrl || project.file || project.url;

      if (!modelPath) {
        const demoObj = buildProceduralDemo(project.demoType || 'villa');
        setupLoadedObject(demoObj, project);
        return;
      }

      loaderEl.classList.add('show');
      gltfLoader.load(
        modelPath,
        (gltf) => {
          loaderEl.classList.remove('show');
          setupLoadedObject(gltf.scene, project);
        },
        undefined,
        (err) => {
          console.warn('Gagal memuat file GLB, menampilkan model pratinjau:', err);
          loaderEl.classList.remove('show');
          const fallbackObj = buildProceduralDemo('villa');
          setupLoadedObject(fallbackObj, project);
        }
      );
    }

    function renderProjectMenu() {
      const listEl = document.getElementById('project-list');
      listEl.innerHTML = '';

      projects.forEach((proj, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `project-item ${idx === currentIndex ? 'active' : ''}`;
        btn.innerHTML = `
          <div>
            <div class="project-item-title">${proj.title}</div>
            <div class="project-item-sub">${proj.location || 'Indonesia'} • ${proj.year || '2026'}</div>
          </div>
          <span class="cat-badge">${proj.category || 'Arsitektur'}</span>
        `;
        btn.addEventListener('click', () => {
          document.getElementById('project-menu').classList.remove('open');
          loadProject(idx);
        });
        listEl.appendChild(btn);
      });
    }

    async function initPortfolio() {
      try {
        const res = await fetch(`./projects.json?v=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          const rawList = Array.isArray(data) ? data : (data.projects || []);
          if (rawList.length > 0) {
            projects = rawList.map((item, i) => ({
              slug: item.slug || item.id || `proyek-${i + 1}`,
              title: item.title || item.name || `Karya ${i + 1}`,
              category: item.category || 'Arsitektur',
              location: item.location || 'Indonesia',
              year: item.year || '2026',
              description: item.description || '',
              model: item.model || item.modelUrl || item.file || item.glb || item.url || ''
            }));
          }
        }
      } catch (e) {
        console.warn('Menggunakan daftar proyek bawaan:', e);
      }

      if (!projects.length) {
        projects = FALLBACK_PROJECTS;
      }

      const params = new URLSearchParams(window.location.search);
      const targetSlug = params.get('project');
      let startIdx = 0;
      if (targetSlug) {
        const found = projects.findIndex((p) => p.slug === targetSlug);
        if (found !== -1) startIdx = found;
      }

      loadProject(startIdx);
    }

    document.getElementById('selector-trigger').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('project-menu').classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('project-menu');
      if (!menu.contains(e.target)) menu.classList.remove('open');
    });

    document.getElementById('prev-project').addEventListener('click', () => loadProject(currentIndex - 1));
    document.getElementById('next-project').addEventListener('click', () => loadProject(currentIndex + 1));

    document.getElementById('info-pill-btn').addEventListener('click', () => {
      document.getElementById('detail-card').classList.toggle('open');
    });
    document.getElementById('detail-close').addEventListener('click', () => {
      document.getElementById('detail-card').classList.remove('open');
    });

    document.querySelectorAll('.view-btn').forEach((btn) => {
      btn.addEventListener('click', () => setCameraView(btn.dataset.view));
    });

    document.getElementById('section-slider').addEventListener('input', (e) => {
      sectionRatio = Number(e.target.value) / 100;
      updateSectionCut(false);
    });

    document.querySelectorAll('.axis-btn[data-axis]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.axis-btn[data-axis]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        sectionAxis = btn.dataset.axis;
        updateSectionCut(true);
      });
    });

    document.getElementById('btn-flip-cut').addEventListener('click', () => {
      sectionFlip = !sectionFlip;
      updateSectionCut(true);
    });

    document.getElementById('btn-close-section').addEventListener('click', () => {
      setCameraView('isometric');
    });

    document.getElementById('btn-edges').addEventListener('click', function () {
      showEdges = !showEdges;
      this.classList.toggle('active', showEdges);
      edgeObjects.forEach((line) => (line.visible = showEdges));
    });

    document.getElementById('btn-rotate').addEventListener('click', function () {
      autoRotate = !autoRotate;
      this.classList.toggle('active', autoRotate);
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.6;
    });

    document.getElementById('btn-theme').addEventListener('click', function () {
      darkTheme = !darkTheme;
      document.body.classList.toggle('dark', darkTheme);
      this.classList.toggle('active', darkTheme);
      scene.background = new THREE.Color(darkTheme ? 0x121518 : 0xF5F6F4);

      scene.remove(gridHelper);
      gridHelper = new THREE.GridHelper(
        60,
        60,
        darkTheme ? 0x334155 : 0xCBD5E1,
        darkTheme ? 0x1E293B : 0xE2E8F0
      );
      gridHelper.position.y = -0.01;
      scene.add(gridHelper);

      edgeObjects.forEach((line) => {
        line.material.color.setHex(darkTheme ? 0xCBD5E1 : 0x1E293B);
      });
    });

    document.getElementById('btn-screenshot').addEventListener('click', () => {
      const prevGuide = cutGuideMesh.visible;
      cutGuideMesh.visible = false;
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      cutGuideMesh.visible = prevGuide;

      const link = document.createElement('a');
      const slug = projects[currentIndex]?.slug || 'polaruang-3d';
      link.download = `${slug}-${sectionMode !== 'none' ? sectionMode : 'view'}.png`;
      link.href = dataUrl;
      link.click();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      if (camAnim) {
        camAnim.t = Math.min(1, camAnim.t + 0.06);
        const ease = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (camAnim.t >= 1) camAnim = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    initPortfolio();
    animate();
  </script>
</body>
</html>
